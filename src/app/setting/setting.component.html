<div class="setting">
  <h1>Your Settings</h1>

  <!-- ---------------- Carrousel Vidéo ---------------- -->
  <div class="video-carousel">
    <video
      [src]="currentVideo"
      class="video-display"
      autoplay
      muted
      loop
      playsinline
    ></video>

    <!-- Contrôles manuels -->
    <div class="video-controls">
      <button type="button" (click)="prevVideo()">Prev</button>
      <button type="button" (click)="nextVideo()">Next</button>
    </div>
  </div>

  <!-- ---------------- Formulaire utilisateur ---------------- -->
  <form [formGroup]="settingForm" (ngSubmit)="submit()" class="setting-form">
    <input
      type="text"
      formControlName="image"
      class="form-control form-control-lg"
      autocomplete="new-username"
      placeholder="Url of profile picture"
    />
    <input
      type="text"
      formControlName="username"
      class="form-control form-control-lg"
      autocomplete="new-username"
      placeholder="Username"
    />
    <textarea
      formControlName="bio"
      rows="6"
      class="form-control form-control-lg"
      placeholder="Short bio about you"
    ></textarea>
    <input
      type="email"
      formControlName="email"
      class="form-control form-control-lg"
      autocomplete="new-email"
      placeholder="Email"
    />
    <input
      type="password"
      formControlName="password"
      class="form-control form-control-lg"
      autocomplete="new-password"
      placeholder="New Password"
    />
    <button type="submit" class="btn update-btn btn-lg">Update Setting</button>
    <hr />
    <button
      type="button"
      class="btn logout-btn btn-outline-danger"
      (click)="logout()"
    >
      Or click here to logout
    </button>
  </form>
</div>
